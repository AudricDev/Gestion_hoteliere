<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur 404</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg, #0f172a, #1e293b);
    color:white;
}

.container{
    text-align:center;
    max-width:600px;
    padding:30px;
}

.error-code{
    font-size:10rem;
    font-weight:bold;
    color:#38bdf8;
    text-shadow:0 0 20px rgba(56,189,248,.5);
}

h1{
    font-size:2rem;
    margin-bottom:15px;
}

p{
    color:#cbd5e1;
    margin-bottom:30px;
    line-height:1.6;
}

.btn{
    display:inline-block;
    padding:12px 30px;
    text-decoration:none;
    background:#38bdf8;
    color:white;
    border-radius:8px;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px);
}
</style>
<body>

    <div class="container">
        <div class="error-code">404</div>

        <h1>Page introuvable</h1>

        <p>
            Désolé, la page que vous recherchez n'existe pas ou a été déplacée.
        </p>

        <a href="{% url "index" %}" class="btn">Retour à l'accueil</a>
    </div>

</body>
</html>
