<!-- Modal profil -->
<div id="profilModal" class="modal">
    <div class="modal-content">
        <a href="#" class="close">&times;</a>
        <div class="header">
            <h2>Mon profil</h2>
        </div>
        <form method="POST" action="{% url 'updateProfil' %}" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-input">
                <label>Nom</label>
                <input type="text" name="first_name" value="{{ request.user.first_name }}">
            </div>
            <div class="form-input">
                <label>Prénom</label>
                <input type="text" name="last_name" value="{{ request.user.last_name }}">
            </div>
            <div class="form-input">
                <label>Email</label>
                <input type="email" name="email" value="{{ request.user.email }}">
            </div>
            <div class="form-input">
                <label>Photo</label>
                <input type="file" name="photo">
            </div>
            {% if request.user.user_profil.photo %}
                <img src="{{ request.user.user_profil.photo.url }}" id="preview">
            {% endif %}
            <button type="submit" class="enregistrer">Mettre à jour</button>
        </form>
    </div>
</div>
<!-- /Modal profil -->
